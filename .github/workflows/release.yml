name: Build and Release

on:
  push:
    branches: [master]
    paths:
      - 'version.json'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = Get-Content version.json | ConvertFrom-Json
          "version=$($v.version)" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore
        run: dotnet restore .\src\ezx6tools.csproj

      - name: Publish
        run: |
          dotnet publish .\src\ezx6tools.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:TrimMode=partial `
            -p:_SuppressWinFormsTrimError=true `
            -p:InvariantGlobalization=true `
            -o publish

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" `
            .\publish\ezx6tools.exe version.json `
            --title "Release v${{ steps.version.outputs.version }}" `
            --notes "Automated release v${{ steps.version.outputs.version }}"
